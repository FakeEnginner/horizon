plugins {
    id 'kotlin-kapt'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.example.horizon'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.horizon"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles '-keep class timber.log.** { *; }'
        }
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '-keep class timber.log.** { *; }'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }
    bundle {
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }
}

dependencies {
    implementation project(path: ':core')
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.0'
    // Activity and Fragment
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    // Lifecycle and ViewModel - All consistent versions
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Timber logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
    // Lottie animation dependencies
    implementation "com.airbnb.android:lottie:6.1.0"
    implementation "androidx.compose.material3:material3-android:1.2.0-alpha09"
    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation("com.google.firebase:firebase-config")
    // Dots indicator
    implementation("com.tbuonomo:dotsindicator:5.0")
    // Room database - FIXED: Updated to latest stable version
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    // Splash screen
    implementation "androidx.core:core-splashscreen:1.0.1"
    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    // Gson
    implementation 'com.google.code.gson:gson:2.11.0'
    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // ExifInterface
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    // Scalable size unit
    implementation "com.intuit.sdp:sdp-android:1.0.6"
    implementation "com.intuit.ssp:ssp-android:1.0.6"
    // Rounded image views
    implementation "com.makeramen:roundedimageview:2.3.0"
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    // Serialization - UPDATED: Latest stable version
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
}